name: Cross-repository interop

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cross-repo-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out YellowFruit
        uses: actions/checkout@v7

      - name: Resolve QBSheet companion ref
        id: resolve-qbsheet
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          candidate="$CANDIDATE_REF"
          if [ -z "$candidate" ]; then candidate=main; fi
          remote_line="$(git ls-remote https://github.com/gbyo/qbsheet.git "refs/heads/$candidate" || true)"
          if [ -z "$remote_line" ]; then
            candidate=main
            remote_line="$(git ls-remote https://github.com/gbyo/qbsheet.git "refs/heads/$candidate")"
          fi
          sha="${remote_line%%$'\t'*}"
          echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out QBSheet companion
        uses: actions/checkout@v7
        with:
          repository: gbyo/qbsheet
          ref: ${{ steps.resolve-qbsheet.outputs.sha }}
          path: qbsheet

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install YellowFruit dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install QBSheet dependencies
        working-directory: qbsheet
        run: npm ci

      - name: Verify runner Chrome
        working-directory: qbsheet
        run: google-chrome --version

      - name: Install Playwright video helper
        working-directory: qbsheet
        run: npx playwright install ffmpeg

      - name: Run real cross-repository browser contract
        working-directory: qbsheet
        env:
          YELLOWFRUIT_REPO: ${{ github.workspace }}
          YELLOWFRUIT_REF: ${{ github.sha }}
        run: npm run test:browser:yellowfruit

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-interop-playwright
          path: |
            qbsheet/playwright-report/
            qbsheet/test-results/
          if-no-files-found: ignore
